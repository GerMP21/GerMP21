<text x="74.2" y="60" font-size="14.5" class="mono ink"><tspan font-weight="700">Python</tspan> is the language I know best. I've used it professionally, and it's the home of my favorite</text>
<text x="74.2" y="83" font-size="14.5" class="mono ink">area: machine learning.</text>
<text x="48" y="112" font-size="14.5" class="mono accent ">▸</text>
<text x="74.2" y="112" font-size="14.5" class="mono ink"><tspan font-weight="700">Rust</tspan> is the one that excites me most right now. It's as fast as C, and its borrow checker makes</text>
<text x="74.2" y="135" font-size="14.5" class="mono ink">code safer, which opens the door to systems programming and games.</text>
<text x="48" y="164" font-size="14.5" class="mono accent ">▸</text>
<text x="74.2" y="164" font-size="14.5" class="mono ink"><tspan font-weight="700">JavaScript</tspan><tspan font-weight="700"> </tspan><tspan font-weight="700">and</tspan><tspan font-weight="700"> </tspan><tspan font-weight="700">TypeScript</tspan> came with two years of focused web development after my bachelor's</text>
<text x="74.2" y="187" font-size="14.5" class="mono ink">degree. I pick up new frameworks and libraries quickly.</text>
<text x="48" y="216" font-size="14.5" class="mono accent ">▸</text>
<text x="74.2" y="216" font-size="14.5" class="mono ink"><tspan font-weight="700">PHP</tspan> is the newest addition: I'm exploring it at the moment.</text>
