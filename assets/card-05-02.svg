<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img" aria-labelledby="t">
<title id="t">Frontend htmx is my first choice. I love low-JS development: the server renders HTML, and htmx adds just the interactivity a page needs, with no build step and no client-side state to keep in sync. When a project really calls for a JavaScript framework, I reach for SvelteKit for its developer experience, or React for single-page apps. Tailwind CSS keeps the styling quick either way.</title>

<style>
  :root { --ink:#1b1b1b; --muted:#6b6b6b; --dim:#9a9a9a; --rule:#cfcfcf; --accent:#b5561a; --link:#3d59a1; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e6e6; --muted:#9a9a9a; --dim:#6f6f6f; --rule:#3a3a3a; --accent:#ff9e64; --link:#7aa2f7; }
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .ink { fill: var(--ink); } .muted { fill: var(--muted); } .dim { fill: var(--dim); } .accent { fill: var(--accent); } .link { fill: var(--link); }
  .rule { stroke: var(--rule); stroke-width: 1; }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .fade { opacity: 0; animation: fade .7s ease forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
  .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .rise, .fade { animation: none; opacity: 1; }
    .blink { animation: none; }
  }
</style>
<g class="fade d1">
<text x="48" y="22" font-size="12" letter-spacing="4" class="mono accent ">FRONTEND</text>
<line x1="48" y1="34" x2="952" y2="34" class="rule"/>
<text x="48.0" y="60" font-size="14.5" class="mono ink">htmx is my first choice. I love low-JS development: the server renders HTML, and htmx adds just the</text>
<text x="48.0" y="83" font-size="14.5" class="mono ink">interactivity a page needs, with no build step and no client-side state to keep in sync. When a</text>
<text x="48.0" y="106" font-size="14.5" class="mono ink">project really calls for a JavaScript framework, I reach for SvelteKit for its developer experience,</text>
<text x="48.0" y="129" font-size="14.5" class="mono ink">or React for single-page apps. Tailwind CSS keeps the styling quick either way.</text>
</g>
</svg>
