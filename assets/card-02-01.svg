<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 139" role="img" aria-labelledby="t">
<title id="t">Omnisnap (Go, AGPL v3): shows which elements render differently in every browser engine your users run, with one command and the browsers already installed. It compares element geometry instead of pixels, reports each difference at the element where it starts, and writes a self-contained report; it also runs as a GitHub Action and from npm or PyPI. Release candidate v0.1.0-rc.5.</title>

<style>
  :root { --ink:#1b1b1b; --muted:#6b6b6b; --dim:#9a9a9a; --rule:#cfcfcf; --accent:#b5561a; --link:#3d59a1; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e6e6; --muted:#9a9a9a; --dim:#6f6f6f; --rule:#3a3a3a; --accent:#ff9e64; --link:#7aa2f7; }
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .ink { fill: var(--ink); } .muted { fill: var(--muted); } .dim { fill: var(--dim); } .accent { fill: var(--accent); } .link { fill: var(--link); }
  .rule { stroke: var(--rule); stroke-width: 1; }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .fade { opacity: 0; animation: fade .7s ease forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
  .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .rise, .fade { animation: none; opacity: 1; }
    .blink { animation: none; }
  }
</style>
<g class="fade d1">
<text x="48" y="22" font-size="14.5" class="mono accent ">▸</text>
<text x="74.2" y="22" font-size="14.5" class="mono ink"><tspan class="link" font-weight="700">Omnisnap</tspan> (Go, AGPL v3): shows which elements render differently in every browser engine your</text>
<text x="74.2" y="45" font-size="14.5" class="mono ink">users run, with one command and the browsers already installed. It compares element geometry</text>
<text x="74.2" y="68" font-size="14.5" class="mono ink">instead of pixels, reports each difference at the element where it starts, and writes a</text>
<text x="74.2" y="91" font-size="14.5" class="mono ink">self-contained report; it also runs as a GitHub Action and from npm or PyPI. Release candidate</text>
<text x="74.2" y="114" font-size="14.5" class="mono ink">v0.1.0-rc.5.</text>
</g>
</svg>
