<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" role="img" aria-labelledby="t">
<title id="t">Setup: CachyOS, niri, Neovim and tools</title>

<style>
  :root { --ink:#1b1b1b; --muted:#6b6b6b; --dim:#9a9a9a; --rule:#cfcfcf; --accent:#3d59a1; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e6e6; --muted:#9a9a9a; --dim:#6f6f6f; --rule:#3a3a3a; --accent:#7aa2f7; }
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .ink { fill: var(--ink); } .muted { fill: var(--muted); } .dim { fill: var(--dim); } .accent { fill: var(--accent); }
  .rule { stroke: var(--rule); stroke-width: 1; }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .fade { opacity: 0; animation: fade .7s ease forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
  .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .rise, .fade { animation: none; opacity: 1; }
    .blink { animation: none; }
  }
</style>
<g class="fade" style="animation-delay:0.15s"><text x="48" y="40" font-size="11.5" letter-spacing="3" class="mono accent ">SYSTEM</text><text x="230" y="40" font-size="14" class="mono ink ">CachyOS on a ThinkPad T480 · LUKS full-disk encryption</text><line x1="48" y1="53" x2="952" y2="53" class="rule"/></g>
<g class="fade" style="animation-delay:0.23s"><text x="48" y="74" font-size="11.5" letter-spacing="3" class="mono accent ">DESKTOP</text><text x="230" y="74" font-size="14" class="mono ink ">niri (scrollable-tiling Wayland) + Noctalia shell · vim-style keys</text><line x1="48" y1="87" x2="952" y2="87" class="rule"/></g>
<g class="fade" style="animation-delay:0.31s"><text x="48" y="108" font-size="11.5" letter-spacing="3" class="mono accent ">TERMINAL</text><text x="230" y="108" font-size="14" class="mono ink ">Alacritty + zsh (vi mode, starship)</text><line x1="48" y1="121" x2="952" y2="121" class="rule"/></g>
<g class="fade" style="animation-delay:0.39s"><text x="48" y="142" font-size="11.5" letter-spacing="3" class="mono accent ">EDITORS</text><text x="230" y="142" font-size="14" class="mono ink ">Neovim (native LSP, Treesitter, Telescope) · Doom Emacs · VSCodium</text><line x1="48" y1="155" x2="952" y2="155" class="rule"/></g>
<g class="fade" style="animation-delay:0.47s"><text x="48" y="176" font-size="11.5" letter-spacing="3" class="mono accent ">DEV</text><text x="230" y="176" font-size="14" class="mono ink ">Docker · Postman · MySQL Workbench</text><line x1="48" y1="189" x2="952" y2="189" class="rule"/></g>
<g class="fade" style="animation-delay:0.55s"><text x="48" y="210" font-size="11.5" letter-spacing="3" class="mono accent ">MUSIC</text><text x="230" y="210" font-size="14" class="mono ink ">Ardour · VCV Rack · yabridge</text><line x1="48" y1="223" x2="952" y2="223" class="rule"/></g>
<g class="fade" style="animation-delay:0.63s"><text x="48" y="244" font-size="11.5" letter-spacing="3" class="mono accent ">APPS</text><text x="230" y="244" font-size="14" class="mono ink ">Obsidian · LibreOffice · GIMP</text><line x1="48" y1="257" x2="952" y2="257" class="rule"/></g>
<g class="fade" style="animation-delay:0.71s"><text x="48" y="278" font-size="11.5" letter-spacing="3" class="mono accent ">BACKUPS</text><text x="230" y="278" font-size="14" class="mono ink ">Syncthing to a second PC</text><line x1="48" y1="291" x2="952" y2="291" class="rule"/></g>
</svg>
